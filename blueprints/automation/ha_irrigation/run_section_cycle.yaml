blueprint:
  name: Irrigation — Run Section Cycle (i18n)
  description: >
    Esegue un ciclo di irrigazione per una sezione: accende uno switch,
    attende la durata, poi spegne. Opzionale notifica.
  domain: automation
  input:
    section_switch:
      name: Switch Sezione
      selector:
        entity:
          domain: switch
    duration_minutes:
      name: Durata (minuti)
      default: 5
      selector:
        number:
          min: 1
          max: 180
          step: 1
          mode: box
    start_time:
      name: Orario di avvio (opzionale)
      default: ""
      selector:
        time: {}
    notify_service:
      name: Servizio notify (opzionale)
      description: Esempio: notify.mobile_app_mio_telefono
      default: ""
      selector:
        text: {}
mode: single
variables:
  lang: "{{ states('input_select.language_gui') or 'it' }}"
  i18n:
    it:
      start: "Avvio irrigazione"
      done: "Irrigazione completata"
    en:
      start: "Irrigation started"
      done: "Irrigation completed"
trigger:
  - platform: time
    at: !input start_time
action:
  - service: switch.turn_on
    target:
      entity_id: !input section_switch
  - choose:
      - conditions: "{{ (notify_service|default('')) != '' }}"
        sequence:
          - service: "{{ notify_service }}"
            data:
              message: >-
                {{ i18n[lang].start }}: {{ states[ (section_switch if section_switch is string else section_switch.entity_id) ].name }}
                ({{ duration_minutes }} min)
  - delay:
      minutes: !input duration_minutes
  - service: switch.turn_off
    target:
      entity_id: !input section_switch
  - choose:
      - conditions: "{{ (notify_service|default('')) != '' }}"
        sequence:
          - service: "{{ notify_service }}"
            data:
              message: >-
                {{ i18n[lang].done }}: {{ states[ (section_switch if section_switch is string else section_switch.entity_id) ].name }}
